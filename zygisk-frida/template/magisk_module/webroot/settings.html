<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rowan · 设置开关</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--brand:#2563EB;--ink:#0F172A;--mut:#64748B;--faint:#94A3B8;--green:#16A34A;--red:#DC2626}
  body{background:#0e1320;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .page{width:390px;min-height:844px;background:linear-gradient(160deg,#dbe6ff,#e0d7ff 45%,#ffd9ec);padding:14px 14px 24px}
  .cap{font-size:11px;font-weight:800;color:#5b6b85;margin:2px 2px 10px}
  .head{display:flex;align-items:center;gap:10px;padding:0 2px 12px}
  .head .back{color:#64748B;font-size:20px}
  .head .t{font-size:17px;font-weight:800;color:var(--ink)}

  .grp{font-size:11px;font-weight:700;color:var(--mut);margin:14px 4px 8px}
  .row{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:6px;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(15,23,42,.07)}
  .row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row .tx{flex:1;min-width:0}
  .row .lb{font-size:13px;font-weight:700;color:var(--ink)}
  .row .ds{font-size:10px;color:var(--mut);margin-top:1px}
  .row .st{font-size:9.5px;font-weight:600;margin-top:2px}
  .st.on{color:var(--green)}.st.off{color:var(--red)}.st.todo{color:var(--faint)}

  /* 开关 */
  .sw{width:44px;height:26px;border-radius:13px;background:#E2E8F0;position:relative;flex:none;cursor:pointer;transition:.2s}
  .sw.on{background:var(--brand)}
  .sw .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw.on .knob{left:21px}
  .spinner{width:16px;height:16px;border:2px solid #D6DEEA;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-notif" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-overlay" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/></symbol>
  <symbol id="i-usage" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-root" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-shizuku" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-13h-7z"/></symbol>
  <symbol id="i-acc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="i-vpn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></symbol>
</svg>

<div class="page">
  <div class="cap">设置 · 权限开关（新版）</div>
  <div class="head"><span class="back">‹</span><span class="t">权限</span></div>

  <div class="grp">常用</div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-folder"/></svg></div><div class="tx"><div class="lb">所有文件访问</div><div class="ds">读写 /sdcard、读 APK</div><div class="st on">已开启</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-notif"/></svg></div><div class="tx"><div class="lb">通知权限</div><div class="ds">后台任务完成时提醒</div><div class="st on">已开启</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-overlay"/></svg></div><div class="tx"><div class="lb">悬浮窗</div><div class="ds">日志窗、小窗终端、悬浮球</div><div class="st on">已开启</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-install"/></svg></div><div class="tx"><div class="lb">安装应用</div><div class="ds">装 APK 需要</div><div class="st off">未开启</div></div><div class="sw"><span class="knob"></span></div></div>

  <div class="grp">应用与媒体</div>
  <div class="row"><div class="ic" style="background:rgba(22,163,74,.12);color:#16A34A"><svg><use href="#i-battery"/></svg></div><div class="tx"><div class="lb">电池优化白名单</div><div class="ds">后台不被杀</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(22,163,74,.12);color:#16A34A"><svg><use href="#i-usage"/></svg></div><div class="tx"><div class="lb">使用情况访问</div><div class="ds">看前台应用、流量归属</div></div><div class="sw"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(22,163,74,.12);color:#16A34A"><svg><use href="#i-img"/></svg></div><div class="tx"><div class="lb">图片读取</div><div class="ds">选头像、看图</div></div><div class="spinner"></div></div>

  <div class="grp">系统能力</div>
  <div class="row"><div class="ic" style="background:rgba(220,38,38,.12);color:#DC2626"><svg><use href="#i-root"/></svg></div><div class="tx"><div class="lb">Root</div><div class="ds">高危操作需要</div><div class="st on">已授权</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(124,58,237,.12);color:#7C3AED"><svg><use href="#i-shizuku"/></svg></div><div class="tx"><div class="lb">Shizuku</div><div class="ds">免 root 的 shell 能力</div></div><div class="sw"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-acc"/></svg></div><div class="tx"><div class="lb">无障碍（读屏）</div><div class="ds">AI 读屏/点滑/截图需要</div><div class="st on">已开启</div></div><div class="sw on"><span class="knob"></span></div></div>
  <div class="row"><div class="ic" style="background:rgba(37,99,235,.12);color:#2563EB"><svg><use href="#i-vpn"/></svg></div><div class="tx"><div class="lb">VPN</div><div class="ds">抓包时才会请求</div></div><div class="sw"><span class="knob"></span></div></div>

  <div class="cap">要点：每行一个彩色图标 + 标题/说明 + 右侧开关；已开启显示绿色状态。</div>
</div>
</body>
</html>
