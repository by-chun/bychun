<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rowan · 液态水珠抽屉</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--brand:#2563EB;--ink:#0F172A;--mut:#64748B}
  body{background:#0b1020;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

  .screen{width:390px;height:844px;position:relative;overflow:hidden;border-radius:20px;background:#FBFBFD}
  .tint{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
  .t1{width:240px;height:240px;background:#D6E4FF;top:-60px;left:-40px}
  .t2{width:260px;height:260px;background:#E9D5FF;top:40%;right:-80px}
  .t3{width:220px;height:220px;background:#FEE2F0;bottom:-40px;left:15%}

  /* 主界面玻璃 */
  .main{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;gap:10px}
  .glass-ph{height:44px;border-radius:13px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
    border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 22px rgba(30,50,90,.06),inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 16px rgba(255,255,255,.3)}
  .glass-ph::before{content:"";position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent)}
  .msg{margin-top:auto;height:52px;border-radius:14px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.18);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.65);
    box-shadow:0 10px 26px rgba(30,50,90,.08),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 18px rgba(255,255,255,.32)}
  .msg::before{content:"";position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent)}

  /* 半屏抽屉：液态水珠玻璃 */
  .drawer{position:absolute;left:0;top:0;bottom:0;width:212px;padding:16px 8px 24px;overflow-y:auto;
    background:rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
    border-right:1px solid rgba(255,255,255,.55);
    box-shadow:14px 0 44px rgba(30,50,90,.09),inset 0 0 28px rgba(255,255,255,.4);
    animation:slidein .45s cubic-bezier(.22,1.2,.36,1)}
  @keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}

  .head{display:flex;align-items:center;padding:2px 6px 14px;opacity:0;animation:rise .5s .1s cubic-bezier(.22,1.4,.36,1) forwards}
  .mark{width:28px;height:28px;border-radius:9px;flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#60A5FA,#A78BFA);
    box-shadow:0 4px 12px rgba(99,102,241,.3),inset 0 1px 0 rgba(255,255,255,.8)}
  .mark::before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
  .mark::after{content:"";position:absolute;top:-60%;left:-80%;width:60%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:rotate(20deg);animation:shine 2.6s ease-in-out infinite}
  @keyframes shine{0%{left:-80%}55%,100%{left:130%}}
  .head .t{margin-left:8px;font-size:17px;font-weight:800;color:var(--ink)}
  .head .x{margin-left:auto;color:#A5ADBB;font-size:16px;cursor:pointer}

  /* 水珠玻璃卡 */
  .card{margin-bottom:11px;border-radius:18px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.15);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 24px rgba(30,50,90,.07),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 20px rgba(255,255,255,.28);
    opacity:0;animation:rise .55s cubic-bezier(.22,1.4,.36,1) forwards}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);pointer-events:none}
  .card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.17s}
  .card:nth-child(4){animation-delay:.22s}.card:nth-child(5){animation-delay:.27s}
  .card:nth-child(6){animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

  .sec{display:flex;align-items:center;gap:8px;padding:12px 10px;cursor:pointer;position:relative;transition:background .2s}
  .sec:active{background:rgba(255,255,255,.25)}
  .sec .ic{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 10px rgba(255,255,255,.4);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  .sec .ic::before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
  .sec .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative}
  .sec.open .ic{transform:scale(1.12) rotate(-4deg)}
  .sec .t{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec .n{font-size:10px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.5);border-radius:9px;padding:1px 7px;flex:none}
  .sec .chev{width:14px;height:14px;color:#B9C2CF;flex:none;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  .sec.open .chev{transform:rotate(90deg)}

  .body{display:none;border-top:1px solid rgba(255,255,255,.55)}
  .body.open{display:block}
  .row{display:flex;align-items:center;gap:7px;padding:10px 10px 10px 14px;cursor:pointer;position:relative;overflow:hidden;
    opacity:0;transform:translateY(6px) scale(.98)}
  .row.show{opacity:1;transform:none}
  .row + .row::before{content:"";position:absolute;top:0;left:34px;right:0;height:.5px;background:rgba(255,255,255,.55)}
  .row .fic{width:15px;height:15px;flex:none;display:flex;align-items:center;justify-content:center;color:#94A3B8}
  .row .fic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row .tt{flex:1;min-width:0;font-size:12.5px;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .n{font-size:9.5px;color:#A5ADBB;flex:none}
  .row.act{background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
  .row.act::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:linear-gradient(180deg,#60A5FA,#A78BFA)}
  .row.act .tt{color:var(--brand);font-weight:700}
  .ripple{position:absolute;border-radius:50%;background:rgba(37,99,235,.16);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(2.6);opacity:0}}
  .foot{display:flex;justify-content:space-between;padding:9px 12px;font-size:11px;border-top:1px solid rgba(255,255,255,.55)}
  .foot .a{color:var(--brand);font-weight:600}.foot .d{color:#DC2626}

  /* 设置单行水珠 */
  .setrow{display:flex;align-items:center;gap:8px;padding:13px 10px;cursor:pointer;border-radius:18px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.15);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 24px rgba(30,50,90,.07),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 20px rgba(255,255,255,.28);
    opacity:0;animation:rise .55s .37s cubic-bezier(.22,1.4,.36,1) forwards}
  .setrow::before{content:"";position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);pointer-events:none}
  .setrow .ic{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#8B5CF6;
    background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
  .setrow .ic::before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
  .setrow .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative}
  .setrow .t{flex:1;font-size:13.5px;font-weight:700;color:var(--ink)}
  .setrow .chev{width:14px;height:14px;color:#B9C2CF;flex:none}
  .hint{font-size:10px;color:#A5ADBB;margin:14px 4px 0;line-height:1.7}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M20 4l-5 5M4 20l5-5M9 8l-3-1 3 5M15 16l3 1-3-5"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
</svg>

<div class="screen">
  <div class="tint t1"></div><div class="tint t2"></div><div class="tint t3"></div>

  <div class="main">
    <div class="glass-ph"></div><div class="glass-ph"></div><div class="glass-ph" style="width:70%"></div>
    <div class="msg"></div>
  </div>

  <div class="drawer">
    <div class="head"><div class="mark"></div><span class="t">Rowan</span><span class="x">✕</span></div>

    <div class="card">
      <div class="sec open" onclick="tg(this)"><span class="ic" style="color:#2563EB"><svg><use href="#i-chat"/></svg></span><span class="t">会话</span><span class="n">12</span><svg class="chev"><use href="#i-chev"/></svg></div>
      <div class="body open">
        <div class="row act show"><span class="fic"><svg><use href="#i-chat"/></svg></span><span class="tt">帮我分析 App</span></div>
        <div class="row show"><span class="fic"><svg><use href="#i-chat"/></svg></span><span class="tt">内存扫描教程</span></div>
        <div class="row show"><span class="fic"><svg><use href="#i-chat"/></svg></span><span class="tt">悬浮窗设计</span></div>
        <div class="foot"><span class="a">＋ 新对话</span><span class="d">全删</span></div>
      </div>
    </div>

    <div class="card">
      <div class="sec" onclick="tg(this)"><span class="ic" style="color:#16A34A"><svg><use href="#i-apps"/></svg></span><span class="t">应用</span><span class="n">8</span><svg class="chev"><use href="#i-chev"/></svg></div>
      <div class="body"></div>
    </div>

    <div class="card">
      <div class="sec" onclick="tg(this)"><span class="ic" style="color:#F59E0B"><svg><use href="#i-folder"/></svg></span><span class="t">文件</span><svg class="chev"><use href="#i-chev"/></svg></div>
      <div class="body"></div>
    </div>

    <div class="card">
      <div class="sec" onclick="tg(this)"><span class="ic" style="color:#0EA5E9"><svg><use href="#i-plug"/></svg></span><span class="t">插件</span><span class="n">6</span><svg class="chev"><use href="#i-chev"/></svg></div>
      <div class="body"></div>
    </div>

    <div class="setrow"><span class="ic"><svg><use href="#i-set"/></svg></span><span class="t">设置</span><svg class="chev"><use href="#i-chev"/></svg></div>

    <div class="hint">液态水珠：玻璃像水珠——透、折射模糊、顶部一道高光反光、边缘柔光，圆润有光泽。</div>
  </div>
</div>

<script>
  function tg(sec){
    sec.classList.toggle('open');
    const body=sec.nextElementSibling;
    if(!body || !body.classList.contains('body')) return;
    const rows=body.querySelectorAll('.row');
    if(body.classList.contains('open')){
      body.classList.remove('open');
      rows.forEach(r=>{ r.classList.remove('show'); r.style.transitionDelay=''; });
    }else{
      body.classList.add('open');
      rows.forEach((r,i)=>{
        r.style.transition='opacity .45s cubic-bezier(.22,1.4,.36,1), transform .45s cubic-bezier(.22,1.4,.36,1)';
        r.style.transitionDelay=(i*0.05)+'s';
        requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.add('show')));
      });
    }
  }
  document.querySelectorAll('.row,.sec,.setrow').forEach(el=>{
    el.addEventListener('pointerdown',function(e){
      const r=el.getBoundingClientRect();
      const d=Math.max(r.width,r.height);
      const s=document.createElement('span');
      s.className='ripple';
      s.style.width=s.style.height=d+'px';
      s.style.left=(e.clientX-r.left-d/2)+'px';
      s.style.top=(e.clientY-r.top-d/2)+'px';
      el.appendChild(s);
      setTimeout(()=>s.remove(),500);
    });
  });
  document.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click',()=>{ document.querySelectorAll('.row').forEach(x=>x.classList.remove('act')); r.classList.add('act'); });
  });
</script>
</body>
</html>
