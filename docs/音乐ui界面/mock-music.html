<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
         background: #fff; display: flex; justify-content: center; padding: 20px; }
  .phone { width: 380px; height: 820px; background: #fff; border-radius: 32px;
           box-shadow: 0 20px 60px rgba(15,23,42,.14); overflow: hidden;
           display: flex; flex-direction: column; }
  .status { height: 38px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-size: 11.5px; color: #64748b; font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 10px; }
  .bar .back { font-size: 20px; color: #2563eb; }
  .bar h1 { font-size: 16px; font-weight: 800; color: #0f172a; }
  .chat { flex: 1; padding: 4px 14px 0; overflow: hidden; }

  .me { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .me .b { background: #2563eb; color: #fff; font-size: 13px; padding: 9px 13px;
           border-radius: 15px 15px 4px 15px; max-width: 82%; }
  .ai { display: flex; gap: 8px; margin-bottom: 12px; }
  .av { width: 26px; height: 26px; border-radius: 50%; background: #eaf1fe; color: #2563eb;
        font-size: 11px; font-weight: 700; display: flex; align-items: center;
        justify-content: center; flex: none; }
  .stack { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .bubble { background: #f7f9fc; border-radius: 14px; padding: 10px 13px; font-size: 13px;
            color: #334155; line-height: 1.55; max-width: 92%; }

  .card { background: #fff; border: 1px solid #eef2f7; border-radius: 16px;
          box-shadow: 0 10px 26px rgba(15,23,42,.07); overflow: hidden; max-width: 306px; }

  /* 顶部：封面 + 信息 */
  .head { display: flex; gap: 10px; padding: 11px 11px 8px; align-items: center; }
  .cover { width: 52px; height: 52px; border-radius: 11px; flex: none;
           background: linear-gradient(135deg,#2563eb,#7c3aed);
           display: flex; align-items: center; justify-content: center;
           color: #fff; font-size: 20px; }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 13px; color: #0f172a; font-weight: 700;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .info span { display: block; font-size: 10px; color: #94a3b8; margin-top: 2px;
               overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .q { flex: none; font-size: 8px; font-weight: 700; color: #2563eb;
       background: #eaf1fe; padding: 2px 5px; border-radius: 4px; }

  .track { height: 3px; background: #eef2f7; border-radius: 2px; margin: 2px 11px 0; }
  .track i { display: block; height: 100%; width: 62%; background: #2563eb; border-radius: 2px; }
  .times { display: flex; justify-content: space-between; align-items: center;
           font-size: 9px; color: #94a3b8; padding: 4px 11px 6px; }
  .speed { color: #2563eb; font-weight: 700; background: #eaf1fe;
           padding: 2px 6px; border-radius: 5px; font-family: ui-monospace, monospace; }

  /* 控制 */
  .ctrl { display: flex; align-items: center; justify-content: center; gap: 18px;
          padding: 2px 0 10px; }
  .c { color: #64748b; font-size: 15px; }
  .c.play { width: 40px; height: 40px; border-radius: 50%; background: #2563eb;
            display: flex; align-items: center; justify-content: center; }
  .c.play:after { content: ""; margin-left: 2px; border-left: 12px solid #fff;
                  border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .c.mode { font-size: 13px; color: #2563eb; }

  /* 播放列表 */
  .pl { border-top: 1px solid #f5f8fc; padding: 6px 10px 4px; }
  .pl .t { font-size: 9.5px; color: #94a3b8; padding: 2px 2px 5px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; }
  .row .n { width: 14px; font-size: 9px; color: #b6c0cd; font-family: ui-monospace, monospace; }
  .row .tt { flex: 1; min-width: 0; font-size: 10.5px; color: #334155;
             overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .d { font-size: 9px; color: #b6c0cd; font-family: ui-monospace, monospace; }
  .row.on .tt { color: #2563eb; font-weight: 600; }
  .row.on .n { color: #2563eb; }

  .acts { display: flex; gap: 7px; padding: 8px 10px 10px; border-top: 1px solid #f5f8fc; }
  .btn { flex: 1; height: 30px; border-radius: 9px; display: flex; align-items: center;
         justify-content: center; font-size: 10.5px; font-weight: 600; }
  .btn.p { background: #2563eb; color: #fff; }
  .btn.s { background: #f1f4f8; color: #475569; }

  .inputbar { padding: 10px 12px 16px; border-top: 1px solid #f1f4f8; display: flex; gap: 9px; }
  .f { flex: 1; height: 38px; border-radius: 19px; background: #f4f7fb; color: #94a3b8;
       font-size: 12.5px; display: flex; align-items: center; padding: 0 14px; }
  .snd { width: 38px; height: 38px; border-radius: 50%; background: #2563eb; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>00:12</span><span>5G ▮▮▮ 84%</span></div>
    <div class="bar"><span class="back">‹</span><h1>AI 助手</h1></div>

    <div class="chat">
      <div class="me"><div class="b">放周杰伦的歌，列表循环</div></div>

      <div class="ai">
        <div class="av">AI</div>
        <div class="stack">
          <div class="bubble">按列表循环开始放，共 6 首：</div>

          <div class="card">
            <div class="head">
              <div class="cover">♪</div>
              <div class="info">
                <b>晴天</b>
                <span>周杰伦 · 叶惠美</span>
              </div>
              <span class="q">FLAC</span>
            </div>

            <div class="track"><i></i></div>
            <div class="times"><span>02:47 / 04:29</span><span class="speed">1.0x</span></div>

            <div class="ctrl">
              <span class="c mode">🔁</span>
              <span class="c">⏮</span>
              <span class="c play"></span>
              <span class="c">⏭</span>
              <span class="c">♡</span>
            </div>

            <div class="pl">
              <div class="t">播放列表 · 6 首 · 循环</div>
              <div class="row on"><span class="n">1</span><span class="tt">晴天 - 周杰伦</span><span class="d">04:29</span></div>
              <div class="row"><span class="n">2</span><span class="tt">七里香 - 周杰伦</span><span class="d">04:59</span></div>
              <div class="row"><span class="n">3</span><span class="tt">稻香 - 周杰伦</span><span class="d">03:43</span></div>
              <div class="row"><span class="n">4</span><span class="tt">夜曲 - 周杰伦</span><span class="d">03:46</span></div>
            </div>

            <div class="acts">
              <div class="btn s">下载</div>
              <div class="btn s">存脚本</div>
              <div class="btn p">暂停</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="inputbar">
      <div class="f">发消息…</div>
      <div class="snd"></div>
    </div>
  </div>
</body>
</html>
