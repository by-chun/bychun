<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
         background: #fff; display: flex; gap: 24px; justify-content: center; padding: 20px; }
  .phone { width: 380px; height: 820px; background: #fff; border-radius: 32px;
           box-shadow: 0 20px 60px rgba(15,23,42,.14); overflow: hidden;
           display: flex; flex-direction: column; }
  .status { height: 38px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-size: 11.5px; color: #64748b; font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 2px 16px 8px; }
  .bar .back { font-size: 20px; color: #2563eb; }
  .bar h1 { font-size: 14px; font-weight: 700; color: #94a3b8; }
  .bar .sp { flex: 1; }
  .bar .ic { color: #94a3b8; font-size: 15px; }

  /* 播放器 */
  .cover { margin: 10px 40px 18px; aspect-ratio: 1/1; border-radius: 22px;
           background: linear-gradient(135deg,#2563eb 0%,#7c3aed 62%,#0f172a 100%);
           display: flex; align-items: center; justify-content: center;
           color: rgba(255,255,255,.9); font-size: 44px;
           box-shadow: 0 22px 50px rgba(37,99,235,.28); }
  .song { padding: 0 26px; }
  .song b { display: block; font-size: 20px; font-weight: 800; color: #0f172a; }
  .song span { display: block; font-size: 12px; color: #94a3b8; margin-top: 4px; }

  .lyric { padding: 14px 26px 4px; text-align: center; }
  .lyric div { font-size: 12.5px; color: #cbd5e1; line-height: 2.1; }
  .lyric .on { color: #2563eb; font-weight: 600; }

  .prog { padding: 8px 26px 2px; }
  .track { height: 3px; background: #eef2f7; border-radius: 2px; position: relative; }
  .track i { display: block; height: 100%; width: 58%; background: #2563eb; border-radius: 2px; }
  .track b { position: absolute; left: 58%; top: -4px; width: 11px; height: 11px;
             border-radius: 50%; background: #fff; border: 2px solid #2563eb;
             transform: translateX(-5px); }
  .times { display: flex; justify-content: space-between; font-size: 9.5px; color: #94a3b8;
           padding: 6px 26px 0; }

  .ctrl { display: flex; align-items: center; justify-content: space-between;
          padding: 14px 34px 6px; }
  .c { color: #64748b; font-size: 17px; }
  .c.big { font-size: 20px; }
  .c.play { width: 54px; height: 54px; border-radius: 50%; background: #2563eb;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 24px rgba(37,99,235,.35); }
  .c.play:after { content: ""; margin-left: 3px; border-left: 15px solid #fff;
                  border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .c.on { color: #2563eb; }

  .bottom { margin-top: auto; display: flex; gap: 10px; padding: 10px 26px 18px; }
  .b { flex: 1; height: 38px; border-radius: 11px; display: flex; align-items: center;
       justify-content: center; font-size: 11.5px; font-weight: 600; }
  .b.s { background: #f1f4f8; color: #475569; }
  .b.p { background: #2563eb; color: #fff; }

  /* 搜索 */
  .searchbar { padding: 0 16px 10px; }
  .s { height: 38px; border-radius: 19px; background: #f4f7fb; display: flex;
       align-items: center; gap: 8px; padding: 0 14px; font-size: 12.5px; color: #94a3b8; }
  .s .q { color: #0f172a; }
  .sect { padding: 4px 20px 8px; font-size: 11px; color: #94a3b8; }
  .hist { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 16px 12px; }
  .h { font-size: 11px; padding: 6px 12px; border-radius: 999px; background: #f4f7fb;
       color: #475569; }
  .r { display: flex; gap: 11px; align-items: center; padding: 11px 16px;
       border-bottom: 1px solid #f7fafd; }
  .rc { width: 40px; height: 40px; border-radius: 10px; flex: none;
        background: linear-gradient(135deg,#2563eb,#7c3aed); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .rc.alt { background: linear-gradient(135deg,#0ea5e9,#22c55e); }
  .rc.alt2 { background: linear-gradient(135deg,#f59e0b,#ef4444); }
  .rmid { flex: 1; min-width: 0; }
  .rmid b { display: block; font-size: 12.5px; color: #0f172a; font-weight: 600; }
  .rmid span { display: block; font-size: 9.5px; color: #94a3b8; margin-top: 2px; }
  .rc2 { flex: none; font-size: 14px; color: #2563eb; }
</style>
</head>
<body>

<!-- 左：播放器 -->
<div class="phone">
  <div class="status"><span>00:21</span><span>5G ▮▮▮ 84%</span></div>
  <div class="bar"><span class="back">⌄</span><span class="sp"></span><span class="ic">⋯</span></div>

  <div class="cover">♪</div>

  <div class="song"><b>晴天</b><span>周杰伦 · 叶惠美</span></div>

  <div class="lyric">
    <div>从前从前 有个人爱你很久</div>
    <div class="on">但偏偏 风渐渐 把距离吹得好远</div>
    <div>好不容易 又能再多爱一天</div>
  </div>

  <div class="prog">
    <div class="track"><i></i><b></b></div>
    <div class="times"><span>02:47</span><span>04:29</span></div>
  </div>

  <div class="ctrl">
    <span class="c on">🔁</span>
    <span class="c big">⏮</span>
    <span class="c play"></span>
    <span class="c big">⏭</span>
    <span class="c">1.0x</span>
  </div>

  <div class="bottom">
    <div class="b s">播放列表</div>
    <div class="b s">搜索</div>
    <div class="b p">收藏</div>
  </div>
</div>

<!-- 右：搜索 -->
<div class="phone">
  <div class="status"><span>00:21</span><span>5G ▮▮▮ 84%</span></div>
  <div class="bar"><span class="back">‹</span><h1>搜索音乐</h1><span class="sp"></span></div>

  <div class="searchbar">
    <div class="s"><span>🔍</span><span class="q">周杰伦</span></div>
  </div>

  <div class="sect">历史</div>
  <div class="hist">
    <div class="h">晴天</div><div class="h">稻香</div><div class="h">夜曲</div><div class="h">薛之谦</div>
  </div>

  <div class="sect">歌曲</div>
  <div class="r">
    <div class="rc">♪</div>
    <div class="rmid"><b>晴天</b><span>周杰伦 · 叶惠美 · FLAC</span></div>
    <span class="rc2">▶</span>
  </div>
  <div class="r">
    <div class="rc alt">♪</div>
    <div class="rmid"><b>七里香</b><span>周杰伦 · 七里香 · 320k</span></div>
    <span class="rc2">▶</span>
  </div>
  <div class="r">
    <div class="rc alt2">♪</div>
    <div class="rmid"><b>稻香</b><span>周杰伦 · 魔杰座 · 320k</span></div>
    <span class="rc2">▶</span>
  </div>
  <div class="r">
    <div class="rc alt">♪</div>
    <div class="rmid"><b>夜曲</b><span>周杰伦 · 十一月的萧邦 · FLAC</span></div>
    <span class="rc2">▶</span>
  </div>

  <div class="bottom">
    <div class="b s">取消</div>
    <div class="b p">全部播放</div>
  </div>
</div>

</body>
</html>
