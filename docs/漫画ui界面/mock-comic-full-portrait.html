<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:380px;height:820px;background:#0B1220;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#E2E8F0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:6px;padding:10px 10px 8px}
  .top .x{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:13px}
  .top .t{flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:10px;color:#94A3B8;background:rgba(255,255,255,.08);border-radius:7px;padding:5px 8px}
  .chip.on{background:#2563EB;color:#fff}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px}
  .page{width:100%;height:100%;max-height:620px;background:#fff;border-radius:3px;padding:8px;display:grid;grid-template-rows:1fr 1.15fr .9fr;gap:7px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .p{background:#F1F5F9;border:2px solid #0F172A;position:relative;overflow:hidden}
  .p::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#E2E8F0 0 2px,transparent 2px 6px);opacity:.5}
  .p.dark{background:#CBD5E1}
  .face{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#94A3B8;transform:translate(-50%,-50%)}
  .bubble{position:absolute;top:8px;left:8px;background:#fff;border:1.5px solid #0F172A;border-radius:10px;padding:3px 7px;font-size:8.5px;color:#334155;z-index:2}
  .bottom{padding:8px 14px 15px}
  .bar{display:flex;align-items:center;gap:10px}
  .btn{height:30px;min-width:40px;border-radius:9px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 10px}
  .btn.pri{background:#2563EB;color:#fff;font-weight:700}
  .info{flex:1;text-align:center;font:10px ui-monospace,monospace;color:#94A3B8}
  .info b{color:#60A5FA}
  .info .tip{display:block;font:8.5px -apple-system;color:#64748B;margin-top:2px}
  .track{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:9px}
  .track i{display:block;width:7%;height:3px;background:#2563EB;border-radius:2px}
</style>
</head>
<body>
  <div class="top">
    <div class="x">✕</div>
    <div class="t">第 12 话 雨夜追踪</div>
    <div class="chip">自动</div>
    <div class="chip on">竖</div>
    <div class="chip">横</div>
  </div>
  <div class="stage">
    <div class="page">
      <div class="p"><div class="bubble">别回头。</div><div class="face"></div></div>
      <div class="p dark"><div class="face" style="background:#64748B"></div></div>
      <div class="p"><div class="bubble">谁在那里？</div></div>
    </div>
  </div>
  <div class="bottom">
    <div class="bar">
      <div class="btn">‹</div>
      <div class="info">第 <b>12</b> / 180 页<span class="tip">左右滑动翻页 · 双击放大</span></div>
      <div class="btn pri">›</div>
      <div class="btn">目录</div>
    </div>
    <div class="track"><i></i></div>
  </div>
</body>
</html>
