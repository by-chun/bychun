<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:820px;height:380px;background:#0B1220;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#E2E8F0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:6px;padding:8px 12px 6px}
  .top .x{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:12px}
  .top .t{flex:1;font-size:12px;font-weight:600}
  .chip{font-size:10px;color:#94A3B8;background:rgba(255,255,255,.08);border-radius:7px;padding:4px 8px;margin-left:4px}
  .chip.on{background:#2563EB;color:#fff}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 26px}
  .page{height:100%;max-height:300px;aspect-ratio:1/1.35;background:#fff;border-radius:2px;padding:6px;display:grid;grid-template-rows:1fr 1.1fr;gap:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .p{background:#F1F5F9;border:2px solid #0F172A;position:relative;overflow:hidden}
  .p::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#E2E8F0 0 2px,transparent 2px 6px);opacity:.5}
  .p.dark{background:#CBD5E1}
  .face{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#94A3B8;transform:translate(-50%,-50%)}
  .bubble{position:absolute;top:6px;left:6px;background:#fff;border:1.5px solid #0F172A;border-radius:8px;padding:2px 6px;font-size:7.5px;color:#334155;z-index:2}
  .bottom{display:flex;align-items:center;gap:10px;padding:6px 18px 10px}
  .btn{height:28px;min-width:38px;border-radius:8px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0 9px}
  .btn.pri{background:#2563EB;color:#fff;font-weight:700}
  .info{font:10px ui-monospace,monospace;color:#94A3B8}
  .info b{color:#60A5FA}
  .track{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}
  .track i{display:block;width:7%;height:3px;background:#2563EB;border-radius:2px}
</style>
</head>
<body>
  <div class="top">
    <div class="x">✕</div>
    <div class="t">第 12 话 雨夜追踪</div>
    <div class="chip">自动</div>
    <div class="chip">竖</div>
    <div class="chip on">横</div>
  </div>
  <div class="stage">
    <div class="page">
      <div class="p"><div class="bubble">别回头。</div><div class="face"></div></div>
      <div class="p dark"><div class="face" style="background:#64748B"></div></div>
    </div>
    <div class="page">
      <div class="p dark"><div class="face" style="background:#64748B"></div></div>
      <div class="p"><div class="bubble">谁在那里？</div></div>
    </div>
  </div>
  <div class="bottom">
    <div class="btn">‹</div>
    <div class="info">第 <b>12</b> / 180 页 · 双页</div>
    <div class="btn pri">›</div>
    <div class="btn">单页</div>
    <div class="track"><i></i></div>
    <div class="btn">目录</div>
  </div>
</body>
</html>
