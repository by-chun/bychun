<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{position:relative;width:380px;height:820px;background:#0B1220;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#E2E8F0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:6px;padding:9px 10px 6px}
  .x{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:13px}
  .t{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font-size:10px;color:#94A3B8;background:rgba(255,255,255,.08);border-radius:7px;padding:5px 8px}
  .chip.on{background:#2563EB;color:#fff}
  .player{height:200px;background:linear-gradient(160deg,#1E293B,#0F172A);display:flex;align-items:center;justify-content:center;position:relative}
  .play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px}
  .pbar{position:absolute;left:14px;right:14px;bottom:10px}
  .track{height:3px;background:rgba(255,255,255,.16);border-radius:2px}
  .track i{display:block;width:38%;height:3px;background:#2563EB;border-radius:2px}
  .sheet{flex:1;background:#fff;color:#0F172A;border-radius:20px 20px 0 0;margin-top:8px;display:flex;flex-direction:column;overflow:hidden}
  .hd{display:flex;align-items:center;padding:10px 16px 6px}
  .hd .t{font-size:13px;font-weight:800;flex:1}
  .hd .n{font:9.5px ui-monospace,monospace;color:#94A3B8}
  .search{display:flex;align-items:center;gap:6px;margin:0 16px 6px;height:30px;background:#F7F9FC;border:1px solid #E8EEF6;border-radius:9px;padding:0 9px;font-size:10px;color:#9AA4B2}
  .search .jump{margin-left:auto;color:#2563EB;font-weight:600}
  .list{flex:1;overflow-y:auto}
  .list::-webkit-scrollbar{width:5px}
  .list::-webkit-scrollbar-thumb{background:#E2E8F0;border-radius:3px}
  .ep{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F6F8FB}
  .num{width:30px;height:24px;border-radius:7px;background:#F4F7FB;color:#64748B;font:9.5px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;flex:none}
  .main{flex:1;min-width:0}
  .nm{font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font:9px ui-monospace,monospace;color:#B6C0CD;margin-top:2px}
  .ep.on{background:#F3F8FF}
  .ep.on .num{background:#2563EB;color:#fff}
  .ep.on .nm{color:#1D4ED8;font-weight:700}
  .ep.on .sub{color:#2563EB}
  .ft{display:flex;align-items:center;gap:10px;padding:9px 16px 16px;border-top:1px solid #F1F5F9}
  .ft .l{flex:1;font-size:11px;color:#334155}
  .ft .l span{display:block;font-size:9px;color:#94A3B8;margin-top:2px}
  .sw{width:38px;height:22px;border-radius:12px;background:#2563EB;position:relative;flex:none}
  .sw i{position:absolute;top:3px;left:19px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.2)}
  .btn{height:32px;padding:0 12px;border-radius:9px;background:#2563EB;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center}
</style>
</head>
<body>
  <div class="top">
    <div class="x">✕</div>
    <div class="t">第 7 集 雨夜追踪</div>
    <div class="chip">自动</div><div class="chip on">竖</div><div class="chip">横</div>
  </div>
  <div class="player"><div class="play">▶</div><div class="pbar"><div class="track"><i></i></div></div></div>
  <div class="sheet">
    <div class="hd"><div class="t">选集</div><div class="n">共 12 集</div></div>
    <div class="search"><span>搜索集数 / 标题</span><span class="jump">跳集</span></div>
    <div class="list">
      <div class="ep"><div class="num">EP05</div><div class="main"><div class="nm">第 5 集 门后的影子</div><div class="sub">23:40 · 已看完</div></div></div>
      <div class="ep"><div class="num">EP06</div><div class="main"><div class="nm">第 6 集 短信</div><div class="sub">22:10 · 已看完</div></div></div>
      <div class="ep on"><div class="num">EP07</div><div class="main"><div class="nm">第 7 集 雨夜追踪</div><div class="sub">23:40 · 看到 08:12</div></div></div>
      <div class="ep"><div class="num">EP08</div><div class="main"><div class="nm">第 8 集 倒计时</div><div class="sub">24:02 · 未看</div></div></div>
      <div class="ep"><div class="num">EP09</div><div class="main"><div class="nm">第 9 集 那双鞋</div><div class="sub">23:18 · 未看</div></div></div>
    </div>
    <div class="ft">
      <div class="l">自动连播<span>播完自动下一集</span></div>
      <div class="sw"><i></i></div>
      <div class="btn">下一集</div>
    </div>
  </div>
</body>
</html>
