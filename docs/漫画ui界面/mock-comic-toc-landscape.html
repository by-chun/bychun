<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:820px;height:380px;background:#0B1220;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#E2E8F0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:6px;padding:8px 12px}
  .x{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);color:#CBD5E1;display:flex;align-items:center;justify-content:center;font-size:12px}
  .t{flex:1;font-size:12px;font-weight:600}
  .chip{font-size:10px;color:#94A3B8;background:rgba(255,255,255,.08);border-radius:7px;padding:4px 8px;margin-left:4px}
  .chip.on{background:#2563EB;color:#fff}
  .main{flex:1;display:flex;gap:10px;padding:0 14px 12px;min-height:0}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
  .page{height:100%;max-height:300px;aspect-ratio:1/1.35;background:#fff;border-radius:2px;padding:6px;display:grid;grid-template-rows:1fr 1.1fr;gap:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .p{background:#F1F5F9;border:2px solid #0F172A;position:relative;overflow:hidden}
  .p::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#E2E8F0 0 2px,transparent 2px 6px);opacity:.5}
  .face{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;background:#94A3B8;transform:translate(-50%,-50%)}
  .toc{width:250px;background:#fff;color:#0F172A;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .toc .h{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid #F1F5F9}
  .toc .h .t{font-size:11.5px;font-weight:800;flex:1}
  .toc .h .n{font:8.5px ui-monospace,monospace;color:#94A3B8}
  .list{flex:1;overflow-y:auto}
  .list::-webkit-scrollbar{width:5px}
  .list::-webkit-scrollbar-thumb{background:#E2E8F0;border-radius:3px}
  .ch{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #F5F8FC}
  .thumb{width:24px;height:32px;border-radius:3px;background:#F1F5F9;border:1px solid #0F172A;position:relative;overflow:hidden;flex:none}
  .thumb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#E2E8F0 0 2px,transparent 2px 5px);opacity:.5}
  .nm{flex:1;font-size:10.5px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s{font:8px ui-monospace,monospace;color:#B6C0CD}
  .ch.on{background:#F3F8FF}
  .ch.on .nm{color:#1D4ED8;font-weight:700}
  .ch.on .s{color:#2563EB}
  .ch.on .thumb{border-color:#2563EB}
  .search{display:flex;align-items:center;gap:6px;margin:0 12px 8px;height:28px;background:#F7F9FC;border:1px solid #E8EEF6;border-radius:9px;padding:0 8px;font-size:9.5px;color:#9AA4B2}
  .search .jump{margin-left:auto;color:#2563EB;font-weight:600}
</style>
</head>
<body>
  <div class="top">
    <div class="x">✕</div>
    <div class="t">第 12 话 雨夜追踪</div>
    <div class="chip">自动</div>
    <div class="chip">竖</div>
    <div class="chip on">横</div>
  </div>
  <div class="main">
    <div class="stage">
      <div class="page">
        <div class="p"><div class="face"></div></div>
        <div class="p" style="background:#CBD5E1"><div class="face" style="background:#64748B"></div></div>
      </div>
      <div class="page">
        <div class="p" style="background:#CBD5E1"><div class="face" style="background:#64748B"></div></div>
        <div class="p"><div class="face"></div></div>
      </div>
    </div>
    <div class="toc">
      <div class="h"><div class="t">目录</div><div class="n">共 48 话</div></div>
      <div class="search"><span>搜索章节</span><span class="jump">跳章</span></div>
      <div class="list">
        <div class="ch"><div class="thumb"></div><div class="nm">第 10 话 短信</div><div class="s">已读</div></div>
        <div class="ch"><div class="thumb"></div><div class="nm">第 11 话 倒计时</div><div class="s">已读</div></div>
        <div class="ch on"><div class="thumb"></div><div class="nm">第 12 话 雨夜追踪</div><div class="s">12/180</div></div>
        <div class="ch"><div class="thumb"></div><div class="nm">第 13 话 那双鞋</div><div class="s">未读</div></div>
        <div class="ch"><div class="thumb"></div><div class="nm">第 14 话 慢半拍</div><div class="s">未读</div></div>
        <div class="ch"><div class="thumb"></div><div class="nm">第 15 话 别回头</div><div class="s">未读</div></div>
      </div>
    </div>
  </div>
</body>
</html>
