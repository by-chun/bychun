<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:380px;height:820px;background:#F2F5FA;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#0F172A;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .hbtn{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.08);display:flex;align-items:center;justify-content:center;font-size:13px;color:#475569}
  .ht{flex:1}
  .ht b{font-size:13px;display:block}
  .ht span{font-size:9px;color:#94A3B8}
  .scroll{flex:1;overflow:hidden;padding:0 12px}
  .ai{background:#fff;border:1px solid #EEF2F7;border-radius:16px;box-shadow:0 8px 22px rgba(15,23,42,.05);padding:12px;margin-bottom:10px}
  .ai h4{font-size:12.5px;margin-bottom:6px}
  .ai p{font-size:11.5px;line-height:1.75;color:#334155}
  .tools{background:#fff;border:1px solid #EEF2F7;border-radius:16px;box-shadow:0 8px 22px rgba(15,23,42,.05);margin-bottom:10px;overflow:hidden}
  .th{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .th .t{font-size:12px;font-weight:700;flex:1}
  .th .n{font:9px ui-monospace,monospace;color:#94A3B8}
  .tr{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid #F7FAFD}
  .ok{width:14px;height:14px;border-radius:50%;background:#10B981;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none}
  .tr .nm{font:10px ui-monospace,monospace;color:#2563EB;flex:none}
  .tr .ar{font:9.5px ui-monospace,monospace;color:#94A3B8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .ex{font:9px ui-monospace,monospace;color:#CBD5E1}
  .vcard{background:#fff;border:1px solid #EEF2F7;border-radius:16px;box-shadow:0 8px 22px rgba(15,23,42,.05);overflow:hidden}
  .player{height:150px;background:linear-gradient(160deg,#1E293B,#0F172A);display:flex;align-items:center;justify-content:center;position:relative}
  .play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:14px;color:#E2E8F0}
  .pbar{position:absolute;left:12px;right:12px;bottom:9px}
  .track{height:3px;background:rgba(255,255,255,.16);border-radius:2px}
  .track i{display:block;width:38%;height:3px;background:#2563EB;border-radius:2px}
  .vi{padding:10px 12px 8px}
  .vi .t{font-size:12px;font-weight:700}
  .vi .s{font:9px ui-monospace,monospace;color:#94A3B8;margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:4px 12px 10px}
  .ep{height:28px;border-radius:8px;background:#F4F7FB;color:#475569;font:10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center}
  .ep.on{background:#2563EB;color:#fff;font-weight:700}
  .vfoot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #F5F8FC;background:#FBFCFE}
  .vfoot .l{flex:1;font-size:10px;color:#64748B}
  .btn{height:28px;padding:0 10px;border-radius:8px;background:#2563EB;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center}
  .composer{margin:6px 12px 12px;padding:8px;background:#fff;border:1px solid #EDF1F6;border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
  .input{height:34px;background:#F7F9FC;border-radius:12px;color:#9AA4B2;font-size:12px;display:flex;align-items:center;padding:0 12px}
</style>
</head>
<body>
  <div class="head">
    <div class="hbtn">☰</div>
    <div class="ht"><b>Rowan</b><span>21 条消息</span></div>
    <div class="hbtn">▶</div><div class="hbtn">▤</div><div class="hbtn">＋</div>
  </div>
  <div class="scroll">
    <div class="ai">
      <h4>找到这部番了</h4>
      <p>共 12 集，已生成选集卡片，点集数就能切换；播完会自动下一集。</p>
    </div>
    <div class="tools">
      <div class="th"><div class="t">工具调用</div><div class="n">3 次</div></div>
      <div class="tr"><div class="ok">✓</div><div class="nm">webSearch</div><div class="ar">"某番 在线观看"</div><div class="ex">›</div></div>
      <div class="tr"><div class="ok">✓</div><div class="nm">fetchPage</div><div class="ar">https://example.com/anime/7 2.1 万字符</div><div class="ex">›</div></div>
      <div class="tr"><div class="ok">✓</div><div class="nm">playVideo</div><div class="ar">第 7 集 已打开播放</div><div class="ex">›</div></div>
    </div>
    <div class="vcard">
      <div class="player"><div class="play">▶</div><div class="pbar"><div class="track"><i></i></div></div></div>
      <div class="vi"><div class="t">第 7 集 · 雨夜追踪</div><div class="s">全 12 集 · 自动连播开</div></div>
      <div class="grid">
        <div class="ep">1</div><div class="ep">2</div><div class="ep">3</div><div class="ep">4</div><div class="ep">5</div><div class="ep">6</div>
        <div class="ep on">7</div><div class="ep">8</div><div class="ep">9</div><div class="ep">10</div><div class="ep">11</div><div class="ep">12</div>
      </div>
      <div class="vfoot"><div class="l">播完自动下一集</div><div class="btn">下一集</div></div>
    </div>
  </div>
  <div class="composer"><div class="input">发消息，或把文件拖进来…</div></div>
</body>
</html>
