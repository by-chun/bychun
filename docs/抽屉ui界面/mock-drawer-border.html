<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rowan · 液态玻璃抽屉</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--ink:#1F2937;--mut:#64748B;--faint:#94A3B8}
  body{background:#0b1020;display:flex;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

  /* 清透水色背景：蓝绿 + 一缕暖光 + 水滴 */
  .screen{width:390px;height:844px;position:relative;overflow:hidden;border-radius:20px;
    background:
      radial-gradient(circle at 25% 18%, rgba(255,255,255,.75), transparent 50%),
      radial-gradient(circle at 78% 12%, rgba(255,224,190,.55), transparent 42%),
      radial-gradient(circle at 82% 75%, rgba(96,165,250,.55), transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(167,139,250,.4), transparent 50%),
      linear-gradient(170deg,#eaf4fb 0%, #cde9fb 45%, #a8d4f2 70%, #cdd9f5 100%)}
  .drop{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 24%, rgba(255,255,255,.95), rgba(255,255,255,.05) 42%, rgba(150,190,225,.3) 66%, rgba(255,255,255,.04) 100%);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.6), inset 0 -6px 12px rgba(20,60,120,.12), 0 8px 22px rgba(20,60,120,.14);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .drop::after{content:"";position:absolute;left:20%;top:13%;width:30%;height:22%;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);filter:blur(2px)}

  /* 主界面占位 */
  .main{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;gap:10px}
  .ph{height:42px;border-radius:12px;background:rgba(255,255,255,.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.6)}
  .msg{margin-top:auto;height:52px;border-radius:16px;background:rgba(255,255,255,.45);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.6)}

  /* 抽屉：液态玻璃 */
  .drawer{position:absolute;left:0;top:0;bottom:0;width:216px;padding:16px 10px 24px;overflow-y:auto;
    background:linear-gradient(160deg, rgba(255,255,255,.42), rgba(255,255,255,.14));
    backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
    border-radius:0 26px 26px 0;
    border-right:1px solid rgba(255,255,255,.75);
    box-shadow:8px 0 30px rgba(20,60,120,.18), inset 0 0 26px rgba(255,255,255,.4)}

  .head{display:flex;align-items:center;padding:2px 6px 14px}
  .mark{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,#60A5FA,#A78BFA);box-shadow:0 3px 10px rgba(20,60,120,.25)}
  .head .t{margin-left:8px;font-size:17px;font-weight:800;color:var(--ink)}
  .head .x{margin-left:auto;color:var(--faint);font-size:16px}

  /* 液态玻璃卡片：镜面高光 + 折射增艳 */
  .card{position:relative;margin-bottom:10px;border-radius:15px;
    background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.15));
    backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.14), 0 10px 28px rgba(20,60,120,.16);
    overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.14) 26%, transparent 48%)}

  .sec{position:relative;display:flex;align-items:center;gap:8px;padding:11px 10px;cursor:pointer}
  .sec .ic{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7)}
  .sec .ic svg{width:16px;height:16px;fill:#475569}
  .sec .t{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec .n{font-size:10px;color:#475569;background:rgba(255,255,255,.55);border-radius:9px;padding:1px 7px;flex:none}
  .sec .chev{width:13px;height:13px;color:var(--faint);flex:none}
  .body{position:relative;border-top:1px solid rgba(255,255,255,.5)}
  .row{position:relative;display:flex;align-items:center;gap:7px;padding:9px 10px 9px 14px;color:#334155;font-size:12px;cursor:pointer}
  .row.act{background:rgba(255,255,255,.35)}
  .row.act::before{content:"";position:absolute;left:0;width:2.5px;height:16px;background:linear-gradient(180deg,#60A5FA,#A78BFA);border-radius:2px}
  .row + .row{border-top:1px solid rgba(255,255,255,.35)}
  .foot{display:flex;justify-content:space-between;padding:8px 12px;font-size:11px;border-top:1px solid rgba(255,255,255,.5)}
  .foot .a{color:#2563EB}.foot .d{color:#DC2626}

  .setrow{position:relative;display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:15px;
    background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.15));
    backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 10px 28px rgba(20,60,120,.16);
    overflow:hidden;cursor:pointer}
  .setrow::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.14) 26%, transparent 48%)}
  .setrow .ic{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7)}
  .setrow .ic svg{width:16px;height:16px;fill:#475569}
  .setrow .t{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
  .setrow .chev{width:13px;height:13px;color:var(--faint)}
  .hint{font-size:10px;color:var(--mut);margin:12px 4px 0;line-height:1.7}
</style>
</head>
<body>
<div class="screen">
  <div class="drop" style="width:150px;height:150px;top:40px;left:-30px;opacity:.9"></div>
  <div class="drop" style="width:86px;height:86px;top:150px;left:150px;opacity:.85"></div>
  <div class="drop" style="width:120px;height:120px;bottom:120px;right:-40px;opacity:.9"></div>
  <div class="drop" style="width:56px;height:56px;bottom:60px;left:230px;opacity:.8"></div>
  <div class="drop" style="width:44px;height:44px;top:320px;right:40px;opacity:.75"></div>

  <div class="main"><div class="ph"></div><div class="ph"></div><div class="ph" style="width:68%"></div><div class="msg"></div></div>

  <div class="drawer">
    <div class="head"><div class="mark"></div><span class="t">Rowan</span><span class="x">✕</span></div>

    <div class="card">
      <div class="sec"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></span><span class="t">会话</span><span class="n">12</span><span class="chev">›</span></div>
      <div class="body">
        <div class="row act">帮我分析 App</div>
        <div class="row">内存扫描教程</div>
        <div class="row">悬浮窗设计</div>
        <div class="foot"><span class="a">＋ 新对话</span><span class="d">全删</span></div>
      </div>
    </div>

    <div class="card"><div class="sec"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></span><span class="t">应用</span><span class="n">8</span><span class="chev">›</span></div></div>
    <div class="card"><div class="sec"><span class="ic"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></span><span class="t">文件</span><span class="chev">›</span></div></div>
    <div class="card"><div class="sec"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7v.5H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg></span><span class="t">插件</span><span class="n">6</span><span class="chev">›</span></div></div>
    <div class="setrow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span><span class="t">设置</span><span class="chev">›</span></div>

    <div class="hint">这版：水色背景 + 水滴；玻璃卡片加镜面高光 + 折射增艳（saturate），能看出「液态玻璃」反光。</div>
  </div>
</div>
</body>
</html>
