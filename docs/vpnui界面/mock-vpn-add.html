<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
         background: #fff; display: flex; justify-content: center; padding: 20px; }
  .phone { width: 380px; height: 820px; background: #fff; border-radius: 32px;
           box-shadow: 0 20px 60px rgba(15,23,42,.14); overflow: hidden;
           display: flex; flex-direction: column; }
  .status { height: 38px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-size: 11.5px; color: #64748b; font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 4px 16px 10px; }
  .bar .back { font-size: 20px; color: #2563eb; }
  .bar h1 { font-size: 16px; font-weight: 800; color: #0f172a; }
  .chat { flex: 1; padding: 4px 14px 0; overflow: hidden; }

  .me { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .me .b { background: #2563eb; color: #fff; font-size: 13px; padding: 9px 13px;
           border-radius: 15px 15px 4px 15px; max-width: 82%; }
  .ai { display: flex; gap: 8px; }
  .av { width: 26px; height: 26px; border-radius: 50%; background: #eaf1fe; color: #2563eb;
        font-size: 11px; font-weight: 700; display: flex; align-items: center;
        justify-content: center; flex: none; }
  .stack { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .bubble { background: #f7f9fc; border-radius: 14px; padding: 10px 13px; font-size: 13px;
            color: #334155; line-height: 1.55; max-width: 92%; }

  .card { background: #fff; border: 1px solid #eef2f7; border-radius: 16px;
          box-shadow: 0 10px 26px rgba(15,23,42,.07); overflow: hidden;
          max-width: 306px; }

  .chead { display: flex; align-items: center; gap: 8px; padding: 11px 12px 9px; }
  .chead .ico { width: 28px; height: 28px; border-radius: 9px; background: #eaf1fe;
                color: #2563eb; display: flex; align-items: center; justify-content: center;
                font-size: 14px; flex: none; }
  .chead b { font-size: 12.5px; color: #0f172a; font-weight: 700; }
  .chead .sub { font-size: 9.5px; color: #94a3b8; margin-top: 1px; }

  .field { padding: 0 12px 9px; }
  .lab { font-size: 9.5px; color: #94a3b8; margin-bottom: 4px; }
  .input { height: 34px; border-radius: 9px; background: #f7f9fc; border: 1px solid #eef2f7;
           display: flex; align-items: center; padding: 0 10px;
           font-size: 10.5px; color: #0f172a; font-family: ui-monospace, monospace;
           overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* 仓库地址 + 更新按钮 */
  .repo { display: flex; gap: 6px; padding: 0 12px 6px; }
  .repo .input { flex: 1; min-width: 0; }
  .refresh { flex: none; height: 34px; padding: 0 10px; border-radius: 9px;
             background: #2563eb; color: #fff; font-size: 10px; font-weight: 600;
             display: flex; align-items: center; }

  .meta { padding: 0 12px 8px; font-size: 9px; color: #94a3b8; }
  .meta em { color: #16a34a; font-style: normal; }

  .nodes { margin: 0 12px 9px; border: 1px solid #f1f4f8; border-radius: 10px; overflow: hidden; }
  .n { display: flex; align-items: center; gap: 7px; padding: 7px 9px;
       border-bottom: 1px solid #f7fafd; font-size: 10px; }
  .n:last-child { border-bottom: 0; }
  .n .f { width: 18px; height: 18px; border-radius: 5px; background: #f1f4f8;
          display: flex; align-items: center; justify-content: center; font-size: 9px; }
  .n b { color: #0f172a; font-weight: 600; flex: 1; }
  .n .ms { color: #16a34a; font-family: ui-monospace, monospace; font-size: 9px; }
  .n .ms.w { color: #f59e0b; }

  .hint { padding: 0 12px 10px; font-size: 9px; color: #b6c0cd; line-height: 1.6; }

  .cfoot { display: flex; gap: 7px; padding: 10px; border-top: 1px solid #f1f4f8; }
  .btn { flex: 1; height: 32px; border-radius: 9px; display: flex; align-items: center;
         justify-content: center; font-size: 11px; font-weight: 600; }
  .btn.p { background: #2563eb; color: #fff; }
  .btn.s { background: #f1f4f8; color: #475569; }

  .inputbar { padding: 10px 12px 16px; border-top: 1px solid #f1f4f8; display: flex; gap: 9px; }
  .fb { flex: 1; height: 38px; border-radius: 19px; background: #f4f7fb; color: #94a3b8;
        font-size: 12.5px; display: flex; align-items: center; padding: 0 14px; }
  .snd { width: 38px; height: 38px; border-radius: 50%; background: #2563eb; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>22:38</span><span>5G ▮▮▮ 84%</span></div>
    <div class="bar"><span class="back">‹</span><h1>AI 助手</h1></div>

    <div class="chat">
      <div class="me"><div class="b">我有个中转站接口，帮我加进来</div></div>

      <div class="ai">
        <div class="av">AI</div>
        <div class="stack">
          <div class="bubble">好，填名称和仓库地址，我拉一下里面的节点。</div>

          <div class="card">
            <div class="chead">
              <div class="ico">⇅</div>
              <div>
                <b>添加 VPN</b>
                <div class="sub">一个地址拉取全部节点</div>
              </div>
            </div>

            <div class="field">
              <div class="lab">名称（你自己起）</div>
              <div class="input">香港-01</div>
            </div>

            <div class="field" style="padding-bottom:4px">
              <div class="lab">仓库地址（中转站接口）</div>
            </div>
            <div class="repo">
              <div class="input">https://sub.example.com/api/v1/…</div>
              <div class="refresh">↻ 更新</div>
            </div>
            <div class="meta">上次更新 22:30 · 拉到 <em>12 个节点</em></div>

            <div class="nodes">
              <div class="n"><div class="f">🇭🇰</div><b>香港 01</b><span class="ms">28ms</span></div>
              <div class="n"><div class="f">🇯🇵</div><b>日本 02</b><span class="ms">46ms</span></div>
              <div class="n"><div class="f">🇸🇬</div><b>新加坡 01</b><span class="ms">63ms</span></div>
              <div class="n"><div class="f">🇺🇸</div><b>美国 03</b><span class="ms w">182ms</span></div>
            </div>

            <div class="hint">点「更新」会重新拉取仓库地址里的节点；改完地址也点它。</div>

            <div class="cfoot">
              <div class="btn s">只保存</div>
              <div class="btn p">保存并连接</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="inputbar">
      <div class="fb">发消息…</div>
      <div class="snd"></div>
    </div>
  </div>
</body>
</html>
