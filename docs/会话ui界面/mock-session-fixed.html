<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{position:relative;width:380px;height:820px;background:#F2F5FA;font-family:-apple-system,system-ui,"Noto Sans SC",sans-serif;color:#0F172A;overflow:hidden}
  .page{position:absolute;inset:0;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .hbtn{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.08);display:flex;align-items:center;justify-content:center;font-size:13px;color:#475569}
  .ht{flex:1}
  .ht b{font-size:13px;display:block}
  .ht span{font-size:9px;color:#94A3B8}
  .empty{flex:1;padding:22px 20px}
  .empty h2{font-size:16px;font-weight:800;margin-bottom:6px}
  .empty p{font-size:10.5px;color:#94A3B8}
  .composer{margin:6px 12px 12px;padding:8px;background:#fff;border:1px solid #EDF1F6;border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
  .input{height:34px;background:#F7F9FC;border-radius:12px;color:#9AA4B2;font-size:12px;display:flex;align-items:center;padding:0 12px}

  .mask{position:absolute;inset:0;background:rgba(15,23,42,.32)}
  .drawer{position:absolute;left:0;top:0;bottom:0;width:300px;background:#fff;box-shadow:12px 0 30px rgba(15,23,42,.18);display:flex;flex-direction:column}
  .dh{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
  .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,#3B82F6,#1D4ED8);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .dh .t{font-size:13px;font-weight:800;flex:1}
  .body{flex:1;padding:4px 0}
  .sec{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;font-weight:700;color:#0F172A}
  .sec .i{width:18px;height:18px;border-radius:6px;background:#EAF1FE;color:#2563EB;font-size:9px;display:flex;align-items:center;justify-content:center}
  .s{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 34px;font-size:11.5px;color:#475569}
  .s .dot{width:5px;height:5px;border-radius:50%;background:#CBD5E1}
  .s.on{color:#2563EB;font-weight:600}
  .s.on .dot{background:#2563EB}
  .newc{display:flex;align-items:center;gap:6px;padding:9px 14px 9px 34px;font-size:11px;color:#2563EB;font-weight:600}
  .del{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 34px;font-size:11px;color:#DC2626}
  .dfoot{padding:10px 14px 16px;border-top:1px solid #F1F5F9;font-size:9.5px;color:#94A3B8}

  .toast{position:absolute;left:24px;right:24px;bottom:86px;background:#0F172A;color:#fff;border-radius:12px;
         padding:10px 12px;font-size:10.5px;box-shadow:0 10px 26px rgba(15,23,42,.25);display:flex;align-items:center;gap:8px}
  .toast .ok{width:14px;height:14px;border-radius:50%;background:#10B981;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</head>
<body>
  <div class="page">
    <div class="head">
      <div class="hbtn">☰</div>
      <div class="ht"><b>Rowan</b><span>新对话</span></div>
      <div class="hbtn">▶</div><div class="hbtn">▤</div><div class="hbtn">＋</div>
    </div>
    <div class="empty">
      <h2>想做什么？</h2>
      <p>直接说，或者把文件、应用拖进来</p>
    </div>
    <div class="composer"><div class="input">发消息，或把文件拖进来…</div></div>
  </div>
  <div class="mask"></div>
  <div class="drawer">
    <div class="dh"><div class="logo">R</div><div class="t">工作区</div><div style="font-size:12px;color:#94A3B8">✕</div></div>
    <div class="body">
      <div class="sec"><div class="i">聊</div>对话</div>
      <div class="s on"><div class="dot"></div>新对话（未保存）</div>
      <div class="s"><div class="dot"></div>修复模块 WebUI 状态</div>
      <div class="s"><div class="dot"></div>内存扫描 128 命中</div>
      <div class="s"><div class="dot"></div>动漫第 7 集直链</div>
      <div class="newc">＋ 新对话</div>
      <div class="del">全部删除</div>
    </div>
    <div class="dfoot">左滑会话可删除 · 删除当前会话会停止输出并清空主页</div>
  </div>
  <div class="toast"><div class="ok">✓</div>已开始新对话，上一条输出已停止</div>
</body>
</html>
